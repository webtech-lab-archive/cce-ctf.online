<!DOCTYPE html>
<html>
<head>
<title>Responsive Layout</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{font-family:Arial;background:#f2f2f2}

header{
  background:#333;color:white;padding:20px;
  display:flex;justify-content:space-between;
  align-items:center
}

nav{display:flex;gap:20px}
nav a{color:white;text-decoration:none}

.container{
  width:90%;margin:30px auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px
}

.card{
  background:white;padding:30px;
  text-align:center;border-radius:10px;
  box-shadow:0 0 8px gray
}

@media(max-width:768px){
  .container{grid-template-columns:repeat(2,1fr)}
  header{flex-direction:column;gap:15px}
}

@media(max-width:480px){
  .container{grid-template-columns:1fr}
  nav{flex-direction:column;text-align:center}
}
</style>
</head>

<body>

<header>
<h1>Responsive Web Design</h1>
<nav>
<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Services</a>
<a href="#">Contact</a>
</nav>
</header>

<main class="container">
<div class="card"><h2>HTML</h2><p>Page structure</p></div>
<div class="card"><h2>CSS</h2><p>Web styling</p></div>
<div class="card"><h2>Flexbox</h2><p>One-dimensional layout</p></div>
<div class="card"><h2>Grid</h2><p>Two-dimensional layout</p></div>
<div class="card"><h2>Responsive</h2><p>Adapts to screen size</p></div>
<div class="card"><h2>Web Design</h2><p>HTML and CSS</p></div>
</main>

</body>
</html>
