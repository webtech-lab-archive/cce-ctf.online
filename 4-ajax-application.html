<!DOCTYPE html>
<html>
<head>
<title>AJAX</title>
<style>
body{text-align:center;font-family:Arial;padding:40px}
button{padding:12px 20px}
#result{margin-top:20px}
</style>
</head>

<body>

<h1>AJAX Web Application</h1>

<button onclick="loadData()">Load Data</button>

<div id="result">Click the button to load data.</div>

<script>
function loadData(){
    let xhr=new XMLHttpRequest();

    xhr.open("GET",
      "https://jsonplaceholder.typicode.com/posts/1",true);

    xhr.onload=function(){
        if(xhr.status===200){
            let data=JSON.parse(xhr.responseText);

            document.getElementById("result").innerHTML=
                "<h3>"+data.title+"</h3>"+
                "<p>"+data.body+"</p>";
        }
        else{
            document.getElementById("result").innerHTML=
                "Error loading data.";
        }
    };

    xhr.onerror=function(){
        document.getElementById("result").innerHTML=
            "Network error.";
    };

    xhr.send();
}
</script>

</body>
</html>
